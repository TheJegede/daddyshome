[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daddyshome"
version = "0.1.0"
description = "Claude Code MCP server — project scaffolding and session resumption"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
daddyshome = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
sources = ["src"]
